<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assist Router</title>
<style>
:root { --bg: #fafaf9; --fg: #1c1917; --muted: #6b6560; --accent: #0f766e; --line: #e7e5e4; }
@media (prefers-color-scheme: dark) { :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #2dd4bf; --line: #44403c; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.6 system-ui, sans-serif; }
main { max-width: 560px; margin: 12vh auto; padding: 0 16px; text-align: center; }
img { width: 96px; height: 96px; }
h1 { margin: 12px 0 4px; }
p { color: var(--muted); }
.langs { display: flex; gap: 12px; justify-content: center; margin-top: 24px; flex-wrap: wrap; }
.langs a { border: 1px solid var(--line); border-radius: 10px; padding: 12px 20px; color: var(--fg);
  text-decoration: none; min-width: 140px; }
.langs a:hover { border-color: var(--accent); }
</style>
<script>
// przeglądarka po polsku -> dokumentacja po polsku, inaczej po angielsku
(function () {
  var lang = (navigator.language || "en").toLowerCase();
  if (location.hash || location.search.indexOf("stay") >= 0) return;
  location.replace(lang.indexOf("pl") === 0 ? "pl/" : "en/");
})();
</script>
</head>
<body>
<main>
  <img src="assets/icon.png" alt="">
  <h1>Assist Router</h1>
  <p>Home Assistant conversation agent that understands everyday questions and commands.</p>
  <div class="langs">
    <a href="pl/" hreflang="pl"><strong>Polski</strong><br>dokumentacja</a>
    <a href="en/" hreflang="en"><strong>English</strong><br>documentation</a>
  </div>
</main>
</body>
</html>
