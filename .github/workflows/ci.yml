name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint-test, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches manifest.json
        run: |
          version=$(jq -r .version custom_components/assist_router/manifest.json)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} ≠ manifest $version"; exit 1; }
      - name: Package the integration
        run: cd custom_components/assist_router && zip -r ../../assist_router.zip . -x '__pycache__/*'
      - uses: softprops/action-gh-release@v2
        with:
          files: assist_router.zip
          generate_release_notes: true
